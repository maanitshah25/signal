<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f1e8;
      --surface: #fffefa;
      --surface2: #eee9de;
      --border: #d8d3c8;
      --border-strong: #bbb6ac;
      --accent: #4f93bd;
      --accent-strong: #2f6f98;
      --accent-soft: #e6f1f7;
      --text: #26343c;
      --muted: #68747a;
      --green: #3f775d;
      --yellow: #946a27;
      --red: #a84c4c;
      --blue: #397aa3;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    a { color: var(--accent-strong); }

    /* ── HEADER ── */
    .header {
      min-height: 52px;
      padding: 0 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: rgba(255, 254, 250, 0.96);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 26px; height: 26px;
      background: var(--accent-soft);
      border: 1px solid #b8d7e8;
      border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      color: var(--accent-strong);
      font-size: 13px;
      font-weight: 750;
    }
    .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .mode-badge {
      display: none;
      font-size: 9px; font-weight: 700;
      background: #f6eddc; color: var(--yellow);
      border: 1px solid #dfc997;
      border-radius: 3px; padding: 2px 5px; letter-spacing: 0.4px;
    }
    .header-nav { display: flex; gap: 2px; align-items: center; }
    .nav-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      color: var(--muted); cursor: pointer;
      padding: 16px 7px 13px; font-size: 12px;
    }
    .nav-btn:hover { color: var(--text); }
    .nav-btn.active { color: var(--accent-strong); border-bottom-color: var(--accent); }
    .nav-btn.icon { font-size: 12px; }

    /* ── PAGE CARD ── */
    .page-card {
      margin: 12px 12px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 13px;
      flex-shrink: 0;
    }
    .page-card-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.65px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-card-label .link-btn { text-transform: none; letter-spacing: 0; }
    .page-detect-row { display: flex; align-items: flex-start; gap: 10px; }
    .detect-info { flex: 1; min-width: 0; }
    .detect-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detect-institution { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detect-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag {
      background: #f3f0e8; border: 1px solid var(--border); border-radius: 3px;
      padding: 3px 6px; font-size: 10px; color: var(--muted);
    }
    .detect-summary { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .detect-placeholder { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .detecting-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .detect-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .cost-hint { font-size: 10px; color: var(--muted); }

    /* ── BUTTONS ── */
    .btn {
      border: 1px solid var(--border-strong); background: var(--surface); color: var(--text);
      cursor: pointer; padding: 7px 11px; border-radius: 4px; font-size: 12px; font-weight: 650;
      white-space: nowrap;
    }
    .btn:hover { border-color: var(--accent); background: #f8fbfc; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
    .btn.primary:hover { background: #255a7d; border-color: #255a7d; }
    .btn.success { background: #edf5ef; border: 1px solid #afcab8; color: var(--green); }
    .btn.ghost { background: none; color: var(--muted); }
    .btn.ghost:hover { color: var(--text); }
    .btn.small { padding: 5px 9px; font-size: 11px; font-weight: 500; }
    .btn.block { width: 100%; }
    .link-btn {
      background: none; border: none; color: var(--accent-strong); cursor: pointer;
      font-size: 11px; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    }
    .link-btn:hover { color: var(--text); }
    .action-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .action-row .btn { flex: 1; }

    /* ── SCROLL AREA ── */
    .scroll-area { flex: 1; overflow-y: auto; padding: 12px; }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

    .section-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); margin: 16px 0 8px;
    }
    .section-title:first-child { margin-top: 4px; }

    /* ── RESEARCHER CARDS ── */
    .researcher-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; margin-bottom: 8px; cursor: pointer;
    }
    .researcher-card:hover { border-color: var(--accent); }
    .researcher-card.active { border-color: #9bc4dc; background: #f5fafc; }
    .rc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .rc-name { font-weight: 600; font-size: 13px; }
    .rc-institution { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rc-badge { font-size: 10px; padding: 3px 6px; border-radius: 3px; font-weight: 650; flex-shrink: 0; border: 1px solid var(--border); }
    .rc-badge.new { background: var(--accent-soft); border-color: #b8d7e8; color: var(--accent-strong); }
    .rc-badge.ok { background: #edf5ef; border-color: #b8cfbf; color: var(--green); }
    .rc-badge.scanning { background: var(--accent-soft); border-color: #b8d7e8; color: var(--accent-strong); }
    .rc-badge.warn { background: #f9eeee; border-color: #dfbaba; color: var(--red); }
    .rc-badge.idle { background: var(--surface2); color: var(--muted); }
    .rc-meta { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
    .rc-stat { font-size: 11px; color: var(--muted); }
    .rc-stat span { color: var(--text); font-weight: 500; }
    .rc-remove {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 18px; padding: 2px 6px; line-height: 1;
    }
    .rc-remove:hover { color: var(--red); }

    /* ── FEED ── */
    .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
    .feed-name { font-weight: 700; font-size: 15px; }
    .feed-inst { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .signal-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; margin-bottom: 8px;
    }
    .signal-card-type { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 5px; }
    .signal-card-type.paper { color: var(--accent-strong); }
    .signal-card-type.citation { color: var(--yellow); }
    .signal-card-type.grant { color: var(--green); }
    .signal-card-type.patent { color: var(--blue); }
    .signal-card-type.collab { color: #55796e; }
    .signal-title { font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
    .signal-title a { color: var(--text); text-decoration: none; }
    .signal-title a:hover { color: var(--accent-strong); text-decoration: underline; }
    .signal-meta { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .signal-summary { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
    .footnote { text-align: center; color: var(--muted); font-size: 10px; margin: 16px 0 8px; }

    .status-dot {
      display: inline-block; width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%; flex-shrink: 0;
    }

    /* ── EMPTY / ERROR ── */
    .empty-state { text-align: left; padding: 30px 14px; color: var(--muted); border-top: 1px solid var(--border); }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-desc { font-size: 12px; line-height: 1.6; }
    .error-msg {
      background: #f9eeee; border: 1px solid #dfbaba; border-radius: 5px;
      padding: 10px 12px; font-size: 12px; color: var(--red); line-height: 1.5; margin-bottom: 10px;
    }
    .notice {
      background: var(--accent-soft); border: 1px solid #b8d7e8; border-radius: 5px;
      padding: 10px 12px; font-size: 12px; color: var(--text); line-height: 1.5; margin-bottom: 10px;
    }

    /* ── AGENT LOG ── */
    .agent-log { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
    .agent-log.active { border-color: var(--accent); }
    .agent-log.done { border-color: var(--green); opacity: 0.8; }
    .agent-log-header {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      font-size: 11px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .agent-log.active .agent-log-header { color: var(--accent-strong); }
    .agent-log-steps { padding: 8px 12px; max-height: 140px; overflow-y: auto; }
    .agent-log-steps::-webkit-scrollbar { width: 3px; }
    .agent-log-steps::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .agent-step { font-size: 11px; color: var(--muted); padding: 3px 0; line-height: 1.4; }
    .agent-step:last-child { color: var(--text); }

    /* ── SETTINGS ── */
    .settings-section {
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; margin-bottom: 10px;
    }
    .settings-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .input-row { display: flex; gap: 6px; }
    .text-input {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 4px; padding: 8px 10px; font-size: 12px; font-family: 'SF Mono', 'Menlo', monospace;
    }
    .text-input:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    .status-line { font-size: 11px; margin-top: 8px; line-height: 1.5; min-height: 14px; }
    .status-line.ok { color: var(--green); }
    .status-line.err { color: var(--red); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; padding: 4px 0; }
    .toggle-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .toggle-row label { cursor: pointer; flex: 1; }
    .settings-footer { text-align: left; color: var(--muted); font-size: 10px; margin: 14px 0 6px; line-height: 1.8; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon" aria-hidden="true">S</div>
    <div class="logo-text">Signal</div>
    <span id="mock-badge" class="mode-badge">MOCK</span>
  </div>
  <div class="header-nav">
    <button class="nav-btn active" id="nav-feed">Feed</button>
    <button class="nav-btn" id="nav-bookmarks">Tracked</button>
    <button class="nav-btn icon" id="nav-settings">Settings</button>
  </div>
</div>

<div class="page-card" id="page-card">
  <div class="page-card-label">Current Page</div>
  <div class="detecting-row">
    <div class="status-dot"></div>
    <span>Checking this page</span>
  </div>
</div>

<div class="scroll-area" id="main-content"></div>

<script src="shared/config.js"></script>
<script src="shared/storage.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
