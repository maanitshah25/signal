<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --surface2: #21212b;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #8888a0;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    a { color: var(--accent2); }

    /* ── HEADER ── */
    .header {
      padding: 12px 12px 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--surface);
    }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo-icon {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .mode-badge {
      display: none;
      font-size: 9px; font-weight: 700;
      background: rgba(251,191,36,0.15); color: var(--yellow);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 4px; padding: 1px 5px; letter-spacing: 0.5px;
    }
    .header-nav { display: flex; gap: 2px; align-items: center; }
    .nav-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px 8px; border-radius: 6px; font-size: 12px; transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.active { background: var(--surface2); color: var(--accent2); }
    .nav-btn.icon { font-size: 14px; padding: 3px 7px; }

    /* ── PAGE CARD ── */
    .page-card {
      margin: 12px 12px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      flex-shrink: 0;
    }
    .page-card-label {
      font-size: 10px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .page-card-label .link-btn { text-transform: none; letter-spacing: 0; }
    .page-detect-row { display: flex; align-items: flex-start; gap: 10px; }
    .detect-info { flex: 1; min-width: 0; }
    .detect-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detect-institution { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detect-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .tag {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 20px;
      padding: 2px 8px; font-size: 10px; color: var(--muted);
    }
    .detect-summary { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
    .detect-placeholder { color: var(--muted); font-size: 12px; line-height: 1.5; }
    .detecting-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .detect-actions { display: flex; gap: 6px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    .cost-hint { font-size: 10px; color: var(--muted); }

    /* ── BUTTONS ── */
    .btn {
      border: 1px solid var(--border); background: var(--surface2); color: var(--text);
      cursor: pointer; padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      white-space: nowrap; transition: all 0.15s;
    }
    .btn:hover { border-color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; color: white; }
    .btn.primary:hover { opacity: 0.85; }
    .btn.success { background: var(--surface2); border: 1px solid var(--green); color: var(--green); }
    .btn.ghost { background: none; color: var(--muted); }
    .btn.ghost:hover { color: var(--text); }
    .btn.small { padding: 5px 9px; font-size: 11px; font-weight: 500; }
    .btn.block { width: 100%; }
    .link-btn {
      background: none; border: none; color: var(--accent2); cursor: pointer;
      font-size: 11px; padding: 0; text-decoration: underline; text-underline-offset: 2px;
    }
    .link-btn:hover { color: var(--text); }
    .action-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .action-row .btn { flex: 1; }

    /* ── SCROLL AREA ── */
    .scroll-area { flex: 1; overflow-y: auto; padding: 12px; }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .section-title {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); margin: 16px 0 8px;
    }
    .section-title:first-child { margin-top: 4px; }

    /* ── RESEARCHER CARDS ── */
    .researcher-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 12px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
    }
    .researcher-card:hover { border-color: var(--accent); }
    .researcher-card.active { border-color: var(--accent); background: var(--surface2); }
    .rc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .rc-name { font-weight: 600; font-size: 13px; }
    .rc-institution { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rc-badge { font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 600; flex-shrink: 0; }
    .rc-badge.new { background: rgba(124,106,247,0.2); color: var(--accent2); }
    .rc-badge.ok { background: rgba(52,211,153,0.1); color: var(--green); }
    .rc-badge.scanning { background: rgba(124,106,247,0.15); color: var(--accent2); }
    .rc-badge.warn { background: rgba(248,113,113,0.12); color: var(--red); }
    .rc-badge.idle { background: var(--surface2); color: var(--muted); }
    .rc-meta { margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; }
    .rc-stat { font-size: 11px; color: var(--muted); }
    .rc-stat span { color: var(--text); font-weight: 500; }
    .rc-remove {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 18px; padding: 2px 6px; line-height: 1;
    }
    .rc-remove:hover { color: var(--red); }

    /* ── FEED ── */
    .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
    .feed-name { font-weight: 700; font-size: 15px; }
    .feed-inst { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .signal-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 11px 12px; margin-bottom: 8px;
    }
    .signal-card-type { font-size: 10px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 5px; }
    .signal-card-type.paper { color: var(--accent2); }
    .signal-card-type.citation { color: var(--yellow); }
    .signal-card-type.grant { color: var(--green); }
    .signal-card-type.patent { color: var(--blue); }
    .signal-card-type.collab { color: #f472b6; }
    .signal-title { font-size: 12px; font-weight: 600; line-height: 1.4; margin-bottom: 4px; }
    .signal-title a { color: var(--text); text-decoration: none; }
    .signal-title a:hover { color: var(--accent2); }
    .signal-meta { font-size: 11px; color: var(--muted); line-height: 1.4; }
    .signal-summary { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; font-style: italic; }
    .footnote { text-align: center; color: var(--muted); font-size: 10px; margin: 16px 0 8px; }

    .pulse {
      display: inline-block; width: 6px; height: 6px; background: var(--accent);
      border-radius: 50%; animation: pulse 1.2s ease-in-out infinite; flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── EMPTY / ERROR ── */
    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-desc { font-size: 12px; line-height: 1.6; }
    .error-msg {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); border-radius: 8px;
      padding: 10px 12px; font-size: 12px; color: var(--red); line-height: 1.5; margin-bottom: 10px;
    }
    .notice {
      background: rgba(124,106,247,0.1); border: 1px solid rgba(124,106,247,0.3); border-radius: 8px;
      padding: 10px 12px; font-size: 12px; color: var(--text); line-height: 1.5; margin-bottom: 10px;
    }

    /* ── AGENT LOG ── */
    .agent-log { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; overflow: hidden; }
    .agent-log.active { border-color: var(--accent); }
    .agent-log.done { border-color: var(--green); opacity: 0.8; }
    .agent-log-header {
      display: flex; align-items: center; gap: 8px; padding: 9px 12px;
      font-size: 11px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .agent-log.active .agent-log-header { color: var(--accent2); }
    .agent-log-steps { padding: 8px 12px; max-height: 140px; overflow-y: auto; scroll-behavior: smooth; }
    .agent-log-steps::-webkit-scrollbar { width: 3px; }
    .agent-log-steps::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    .agent-step { font-size: 11px; color: var(--muted); padding: 3px 0; line-height: 1.4; font-family: 'SF Mono', 'Menlo', monospace; }
    .agent-step:last-child { color: var(--text); }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .blink { animation: blink 1s ease infinite; color: var(--accent2) !important; }

    /* ── SETTINGS ── */
    .settings-section {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; margin-bottom: 10px;
    }
    .settings-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 8px;
    }
    .input-row { display: flex; gap: 6px; }
    .text-input {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; font-family: 'SF Mono', 'Menlo', monospace;
    }
    .text-input:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 11px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
    .status-line { font-size: 11px; margin-top: 8px; line-height: 1.5; min-height: 14px; }
    .status-line.ok { color: var(--green); }
    .status-line.err { color: var(--red); }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12px; padding: 4px 0; }
    .toggle-row input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
    .toggle-row label { cursor: pointer; flex: 1; }
    .settings-footer { text-align: center; color: var(--muted); font-size: 10px; margin: 14px 0 6px; line-height: 1.8; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">Signal</div>
    <span id="mock-badge" class="mode-badge">MOCK</span>
  </div>
  <div class="header-nav">
    <button class="nav-btn active" id="nav-feed">Feed</button>
    <button class="nav-btn" id="nav-bookmarks">Tracked</button>
    <button class="nav-btn icon" id="nav-settings" title="Settings" aria-label="Settings">⚙</button>
  </div>
</div>

<div class="page-card" id="page-card">
  <div class="page-card-label">Current Page</div>
  <div class="detecting-row">
    <div class="pulse"></div>
    <span>Analyzing page…</span>
  </div>
</div>

<div class="scroll-area" id="main-content"></div>

<script src="shared/config.js"></script>
<script src="shared/storage.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
