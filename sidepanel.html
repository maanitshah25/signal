<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #18181f;
      --surface2: #21212b;
      --border: #2a2a38;
      --accent: #7c6af7;
      --accent2: #a78bfa;
      --text: #e8e8f0;
      --muted: #8888a0;
      --green: #34d399;
      --yellow: #fbbf24;
      --red: #f87171;
      --blue: #60a5fa;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    .header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--surface);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 24px; height: 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
    }
    .logo-text {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.3px;
      color: var(--text);
    }
    .header-nav {
      display: flex;
      gap: 4px;
    }
    .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--surface2); color: var(--text); }
    .nav-btn.active { background: var(--surface2); color: var(--accent2); }

    /* ── CURRENT PAGE CARD ── */
    .page-card {
      margin: 12px 12px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      flex-shrink: 0;
    }
    .page-card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .page-detect-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .detect-info { flex: 1; min-width: 0; }
    .detect-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detect-institution {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detect-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 8px;
      font-size: 10px;
      color: var(--muted);
    }
    .detect-summary {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }
    .bookmark-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s;
      flex-shrink: 0;
    }
    .bookmark-btn:hover { opacity: 0.85; }
    .bookmark-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .bookmark-btn.bookmarked {
      background: var(--surface2);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .detect-placeholder {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .detecting-row {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ── SCROLL AREA ── */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }
    .scroll-area::-webkit-scrollbar { width: 4px; }
    .scroll-area::-webkit-scrollbar-track { background: transparent; }
    .scroll-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── SECTION ── */
    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--muted);
      margin: 16px 0 8px;
    }
    .section-title:first-child { margin-top: 4px; }

    /* ── RESEARCHER CARDS ── */
    .researcher-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .researcher-card:hover { border-color: var(--accent); }
    .researcher-card.active { border-color: var(--accent); background: var(--surface2); }
    .rc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .rc-name { font-weight: 600; font-size: 13px; }
    .rc-institution { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .rc-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .rc-badge.new { background: rgba(124,106,247,0.2); color: var(--accent2); }
    .rc-badge.ok { background: rgba(52,211,153,0.1); color: var(--green); }
    .rc-meta { margin-top: 6px; display: flex; gap: 10px; }
    .rc-stat { font-size: 11px; color: var(--muted); }
    .rc-stat span { color: var(--text); font-weight: 500; }

    /* ── INTELLIGENCE FEED ── */
    .feed-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .feed-name { font-weight: 700; font-size: 15px; }
    .feed-inst { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .back-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 11px;
      transition: all 0.15s;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); }

    .signal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      margin-bottom: 8px;
    }
    .signal-card-type {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .signal-card-type.paper { color: var(--accent2); }
    .signal-card-type.citation { color: var(--yellow); }
    .signal-card-type.grant { color: var(--green); }
    .signal-card-type.patent { color: var(--blue); }
    .signal-card-type.collab { color: #f472b6; }

    .signal-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .signal-title a { color: var(--text); text-decoration: none; }
    .signal-title a:hover { color: var(--accent2); }
    .signal-meta {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4;
    }
    .signal-summary {
      font-size: 11px;
      color: var(--muted);
      margin-top: 5px;
      line-height: 1.5;
      font-style: italic;
    }

    /* ── LOADING ── */
    .loading-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }
    .loading-text { color: var(--muted); font-size: 12px; margin-top: 8px; line-height: 1.5; }
    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pulse {
      display: inline-block;
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-desc { font-size: 12px; line-height: 1.6; }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 2px;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .tab {
      flex: 1;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .tab.active { background: var(--surface2); color: var(--text); }

    .error-msg {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--red);
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div class="logo-text">Signal</div>
  </div>
  <div class="header-nav">
    <button class="nav-btn active" id="nav-feed">Feed</button>
    <button class="nav-btn" id="nav-bookmarks">Tracked</button>
  </div>
</div>

<!-- Current page detection card -->
<div class="page-card" id="page-card">
  <div class="page-card-label">Current Page</div>
  <div class="detecting-row" id="detect-status">
    <div class="pulse"></div>
    <span>Analyzing page…</span>
  </div>
</div>

<!-- Main scroll area -->
<div class="scroll-area" id="main-content">
  <div class="empty-state">
    <div class="empty-icon">🔬</div>
    <div class="empty-title">No researchers tracked yet</div>
    <div class="empty-desc">Navigate to a researcher or lab page and click Bookmark to start receiving intelligence.</div>
  </div>
</div>

<script src="sidepanel.js"></script>
</body>
</html>
